#Friendship Mod Configuration
#enableFtbQuestIndependentMode controls whether the FTB quest independent player setting is available.
#Default is false because FTB quest independent mode currently has many known bugs.
#enableLinkSharedHealth controls whether Soul Link merges the two players' health pools.
#Default is false because link shared health currently has many known bugs.
#renewAllSparksOnClick controls whether clicking one fire renews every friend's spark.
#feedItemBlacklist is a comma-separated list of item IDs that Friendship must never consume when feeding.
